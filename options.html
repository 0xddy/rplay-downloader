<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RPlay · DRM</title>
  <style>
    body { margin:0; background:#f3f8fc; color:#20364b; font:16px/1.65 system-ui,sans-serif; }
    main { max-width:560px; margin:60px auto; padding:32px; background:white; border:1px solid #dce8f1; border-radius:16px; }
    h1 { font-size:26px; margin:0 0 12px; } p { color:#526a7e; }
    label { display:block; margin:20px 0 6px; font-weight:600; }
    input { box-sizing:border-box; width:100%; padding:11px; border:1px solid #a7bfce; border-radius:7px; font:inherit; }
    button { background:#087bc2; border:0; color:white; padding:12px 18px; border-radius:7px; font:inherit; cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; } #status { min-height:26px; overflow-wrap:anywhere; }
    .actions { margin-top:24px; } input[type=file] { font-size:14px; }
    #deviceStatus { padding:12px 14px; background:#eef8f3; border-radius:7px; color:#276847; }
    #restore { background:#edf3f8; color:#315972; }
    @media(max-width:640px) { main { margin:20px 12px; padding:24px; } }
  </style>
</head>
<body>
  <main>
    <h1 data-i18n="drmSettings">DRM 设置</h1>
    <p data-i18n="drmSetupHelp">插件自动使用内置设备完成授权，无需启动其他程序。开始播放视频后，选择画质并点击下载。</p>
    <p id="deviceStatus" role="status" aria-live="polite"></p>
    <form id="settings">
      <label for="device" data-i18n="drmImport">更换设备（可选）</label>
      <input id="device" type="file" accept=".wvd" required>
      <div class="actions"><button id="save" type="submit" data-i18n="drmSave">导入设备</button></div>
    </form>
    <p><button id="restore" type="button" data-i18n="drmRestore">恢复内置设备</button></p>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="dist/options.js"></script>
</body>
</html>
